services:
  postgres:
    image: postgres:16-alpine
    container_name: bestal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bestal
      POSTGRES_PASSWORD: bestal
      POSTGRES_DB: bestal
    ports:
      # Host 5432 is often taken by system Postgres; publish on 5433 instead.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bestal -d bestal']
      interval: 10s
      timeout: 5s
      retries: 5

  resume-analyser:
    build:
      context: ./apps/resume_analyser
      dockerfile: Dockerfile
    container_name: bestal-resume-analyser
    restart: unless-stopped
    env_file:
      - ./apps/resume_analyser/.env
    ports:
      - '8001:8000'

volumes:
  postgres_data:
