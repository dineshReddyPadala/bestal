services:
  postgres:
    image: postgres:16-alpine
    container_name: bestal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bestal
      POSTGRES_PASSWORD: bestal
      POSTGRES_DB: bestal
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bestal -d bestal']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
