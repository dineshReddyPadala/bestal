version: '3.8'

volumes:
  n8n_storage:

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_app
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Tell n8n to connect to an external PostgreSQL database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=164.52.222.169
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_database
      - DB_POSTGRESDB_USER=postgres_admin_user
      # Single quotes around the password escape the special characters safely in Docker
      - DB_POSTGRESDB_PASSWORD='pg_admin_user_pwd_caa_fa_$%^&OIukhjgcvbn'
    volumes:
      - n8n_storage:/home/node/.n8n
