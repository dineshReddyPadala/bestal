# Local n8n for BesTal development.
# Usage (from n8n/):
#   docker compose -f docker-compose.dev.yml up -d
#
# BesTal workflow JSON reads $env.N8N_WEBHOOK_SECRET, $env.BESTAL_API_BASE_URL,
# $env.AUTOMATION_CALLBACK_SECRET — set below (must match Platform Settings + API .env).

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: bestal_n8n_dev
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      # n8n core
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_SECURE_COOKIE: 'false'
      # PostgreSQL (workflow + credential storage)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: 164.52.222.169
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n_database
      DB_POSTGRESDB_USER: postgres_admin_user
      DB_POSTGRESDB_PASSWORD: 'pg_admin_user_pwd_caa_fa_$%^&OIukhjgcvbn'
      # BesTal workflow env (BESTAL_RESUME_AI_SCREENING.json)
      BESTAL_API_BASE_URL: http://host.docker.internal:3000
      N8N_WEBHOOK_SECRET: n8n-secret-key-bestal-api
      AUTOMATION_CALLBACK_SECRET: n8n-secret-key-bestal-apicallback
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - n8n_storage_dev:/home/node/.n8n

volumes:
  n8n_storage_dev:
