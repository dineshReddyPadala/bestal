# Production static hosting for apps/web/dist after `npm run build` (Vite + prerender).
# Do not proxy www.bestal.co to `vite` / `vite preview` — crawlers must receive
# prerendered HTML, not the /@vite/client shell.
#
# Also 301 the apex host. TLS termination can sit in front of this server.

server {
    listen 80;
    server_name bestal.co;
    return 301 https://www.bestal.co$request_uri;
}

server {
    listen 80;
    server_name www.bestal.co;
    root /var/www/bestal/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
}
