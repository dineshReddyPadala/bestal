# Production nginx — copy to /etc/nginx/sites-available/bestal
#
# Hosts:
#   bestal.co      → 301 https://www.bestal.co
#   www.bestal.co  → marketing dist; /api/v1 → :9002
#   app.bestal.co  → product SPA on :9001; /api/v1 → :9002
#   api.bestal.co  → API on :9002
#
# Before reload: DNS A/CNAME for app.bestal.co, then expand the cert:
#   certbot --nginx -d bestal.co -d www.bestal.co -d api.bestal.co -d app.bestal.co
#
# :9001 must serve apps/web/dist with SPA fallback (try_files → index.html).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bestal.co;
    ssl_certificate /etc/letsencrypt/live/bestal.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bestal.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.bestal.co$request_uri;
}

server {
    server_name www.bestal.co;
    root /home/e2e/bestal/apps/marketingsite/dist;
    index index.html;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bestal.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bestal.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name app.bestal.co;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bestal.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bestal.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name api.bestal.co;

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bestal.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bestal.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.bestal.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = bestal.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name bestal.co www.bestal.co;
    return 404; # managed by Certbot
}

server {
    if ($host = app.bestal.co) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name app.bestal.co;
    return 404;
}

server {
    if ($host = api.bestal.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.bestal.co;
    return 404; # managed by Certbot
}
